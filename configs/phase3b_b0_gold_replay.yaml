experiment:
  name: phase3b_b0_gold_replay
  runtime_output_dir: outputs/phase3b_generated_replay/training/b0_gold_replay
  seed: 3407
  experiment_type: matched_continuation_fixed_policy_replay_control
source:
  selector: outputs/phase3a_phrase_grounding/selection/p1_selector.json
  checkpoint: /data/yz/groundingLMM_official/checkpoints/phase3a_phrase_grounding/p1/best/checkpoint/mp_rank_00_model_states.pt
  checkpoint_sha256: fa4856f8c173c300050c3ae2149354e63a52bbced762d83fe518e9666136b326
  optimizer_step: 3500
  epoch: 7
architecture: {model: GLaMM, token_strategy: fixed_cls_query}
model:
  version: checkpoints/GLaMM-FullScope
  vision_tower: openai/clip-vit-large-patch14-336
  vision_pretrained: null
  pretrained: true
  token_strategy: fixed_cls_query
  model_max_length: 1536
  image_size: 1024
  out_dim: 256
  precision: bf16
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  lora_target_modules: q_proj,v_proj
  train_mask_decoder: true
  freeze_region_encoder: true
forensics:
  unified_training: true
  canonical_unified_prompt: "Determine whether this image is authentic and explain the forensic evidence."
  canonical_prompt_id: unified_forensics_v1
  canonical_prompt_sha256: 32f0856f718fb3e19f34b552892636fb6c2613adbae4afb8826dea89f670654d
  target_protocol: phrase_aligned
data:
  manifest_dir: outputs/data_audits/unified_forensics_split_v1
  datasets_root: datasets
  synthscars_root: datasets/SynthScars
  frozen_split: true
trainable:
  llm_base: false
  vision_tower: false
  mm_projector: false
  grounding_encoder: false
  region_encoder: false
  lora: true
  classification_head: true
  text_hidden_fcs: true
  mask_decoder: true
  embeddings: true
  lm_head: true
optimizer:
  name: AdamW
  lora_lr: 0.0003
  classification_head_lr: 0.0003
  text_hidden_fcs_lr: 0.0003
  mask_decoder_lr: 0.0003
  embedding_lr: 0.0003
  lm_head_lr: 0.0003
  betas: [0.9, 0.95]
  weight_decay: 0.0
  gradient_clip_norm: 1.0
training:
  epochs: 8
  optimizer_steps_per_epoch: 250
  total_optimizer_steps: 2000
  batch_size_per_device: 10
  gradient_accumulation_steps: 2
  effective_global_batch: 20
  scheduler: linear_warmup_decay
  warmup_steps: 100
  validation_interval: 250
loss:
  text_weight: 1.0
  classification_weight: 1.0
  mask_bce_weight: 2.0
  mask_dice_weight: 0.5
  consistency_weight: 0.0
  seg_token_weight: 0.0
  per_sample_text_loss_normalization: false
text_loss: {normalization: token_mean, ignore_index: -100}
mask_loss: {bce_weight: 2.0, dice_weight: 0.5, fake_only: true}
classification_loss: {weight: 1.0}
features: {npr: false, srm: false, forensic_fusion: none, consistency_loss: 0.0, seg_token_loss: 0.0}
replay:
  context: gold
  cache: outputs/phase3b_generated_replay/cache/train_fake_p1_g0.jsonl
  fraction: 0.5
  auxiliary_weight: 1.0
  eligibility: exactly_one_seg_with_preceding_predictor_token
  labels: all_ignore
  classification_loss: zero
checkpoint:
  output_root: checkpoints/GLaMM_train/phase3b_generated_replay/b0_gold_replay
  save_every_steps: 250
  selector: max_internal_val_fake_g0_mean_foreground_iou_then_f1
  use_test_for_selection: false
evaluation:
  primary_mode: G0
  generation_strategy: greedy
  max_new_tokens: 400
  mask_logit_threshold: 0.0
seed: 3407
