experiment:
  name: phase3e_joint_language_mask_posttraining
  seed: 3407
  output_root: outputs/phase3e_joint_language_mask_posttraining
  checkpoint_root: /data/yz/groundingLMM_official/checkpoints/phase3e_joint_language_mask_posttraining
  arms: [P1-FROZEN, P3E-SFT-CONT, P3E-JOINT]
source:
  model_config: configs/phase3a_p1.yaml
  selector: outputs/phase3a_phrase_grounding/selection/p1_selector.json
  checkpoint: /data/yz/groundingLMM_official/checkpoints/phase3a_phrase_grounding/p1/best/checkpoint/mp_rank_00_model_states.pt
  checkpoint_sha256: fa4856f8c173c300050c3ae2149354e63a52bbced762d83fe518e9666136b326
  optimizer_step: 3500
  epoch: 7
data:
  manifest_dir: outputs/data_audits/unified_forensics_split_v1
  datasets_root: datasets
  synthscars_root: datasets/SynthScars
  train_split: train
  selector_split: val
  target_protocol: phrase_aligned
  sampler: balanced_real_fake_deterministic
  mask_provenance: frozen_synthscars_annotation_polygons_per_image_all_ref_union
prompt:
  template_id: unified_forensics_v1
  user_question: Determine whether this image is authentic and explain the forensic evidence.
  legacy_localization_question_allowed: false
trainable:
  P3E-SFT-CONT: [lora]
  P3E-JOINT: [lora, text_hidden_fcs, mask_decoder]
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.05
  lora_target_modules: [q_proj, v_proj]
  frozen: [llm_base, token_embedding, lm_head, classification_head, vision_tower, grounding_image_encoder, mm_projector, region_encoder]
loss:
  language_ce_weight: 1.0
  mask_lambda: 1.0
  mask_bce_weight: 2.0
  mask_dice_weight: 0.5
  classification_weight: 0.0
  reward: null
optimizer:
  name: AdamW
  lora_lr: 1.0e-5
  text_hidden_fcs_lr: 3.0e-4
  mask_decoder_lr: 3.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  scheduler: linear_warmup_decay
  warmup_steps: 100
training:
  total_optimizer_steps: 1000
  checkpoint_interval: 100
  batch_size_per_device: 1
  gradient_accumulation_steps: 4
  effective_batch_size: 4
  total_image_exposures: 4000
  precision: bf16
  gradient_clip_norm: 1.0
  gradient_audit_fake_batch_size: 1
  workers: 0
selector:
  split: internal_validation
  primary: fake_g0_per_image_mean_foreground_iou
  tie_breaker: fake_g0_per_image_mean_foreground_f1
  candidate_steps: [0, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000]
  classification_accuracy_max_drop: 0.005
  classification_f1_max_drop: 0.005
  structure_validity_max_drop: 0.005
  prohibited: [training_loss, tf_phrase_alone, internal_test, official1000, reward, qualitative]
evaluation:
  g0_generation_batch_size: 1
  tf_user_prompt: canonical
  generation_strategy: greedy
  max_new_tokens: 400
  mask_logit_threshold: 0.0
  bootstrap_repeats: 10000
  bootstrap_seed: 3407
runtime:
  SFT_CONT_gpu: 1
  JOINT_gpu: 2
  pytorch_cuda_alloc_conf: max_split_size_mb:512
