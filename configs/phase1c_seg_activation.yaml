experiment:
  output_dir: outputs/phase1c_seg_activation
  seed: 3407
  phase1b_checkpoint: outputs/phase1b_overfit/final_checkpoint.pt

model:
  version: checkpoints/GLaMM-FullScope
  vision_tower: openai/clip-vit-large-patch14-336
  vision_pretrained: null
  pretrained: true
  token_strategy: fixed_cls_query
  model_max_length: 1536
  image_size: 1024
  out_dim: 256
  precision: bf16
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  lora_target_modules: q_proj,v_proj
  train_mask_decoder: true

data:
  manifest_dir: outputs/phase1b_overfit/subset_manifests
  full_train_manifest: outputs/data_audits/unified_forensics_split_v1/train_combined.jsonl
  datasets_root: datasets
  synthscars_root: datasets/SynthScars
  num_real: 32
  num_fake: 32
  content_groups: [human, animal, object, scene]

loss:
  text_weight: 1.0
  classification_weight: 1.0
  mask_bce_weight: 2.0
  mask_dice_weight: 0.5
  seg_token_weight: 0.0
  consistency_weight: 0.0
  per_sample_text_loss_normalization: false

generation:
  max_new_tokens: 400
  do_sample: false
  num_beams: 1

training:
  max_optimizer_steps: 320
  batch_size_per_device: 2
  gradient_accumulation_steps: 1
  learning_rate: 0.0003
  betas: [0.9, 0.95]
  weight_decay: 0.0
  scheduler: linear_warmup_decay
  warmup_steps: 20
  gradient_clip_norm: 1.0
  num_workers: 0

mask8_overfit:
  max_optimizer_steps: 1000
  evaluation_interval: 100
  batch_size: 2
  learning_rate: 0.0003
  early_stop_mean_iou: 0.95

features:
  use_npr: false
  use_srm: false
  forensic_fusion: none
  consistency_loss: false
  known_fake_auxiliary_training: false
  artifact_type_head: false
  prompt_diversity_training: false
