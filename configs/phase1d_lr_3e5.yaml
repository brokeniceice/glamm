experiment:
  name: phase1d_lr_3e5
  output_dir: outputs/phase1d_training_policy/lr_ablation/lr_3e5
  seed: 3407

model:
  version: checkpoints/GLaMM-FullScope
  vision_tower: openai/clip-vit-large-patch14-336
  vision_pretrained: null
  pretrained: true
  token_strategy: fixed_cls_query
  model_max_length: 1536
  image_size: 1024
  out_dim: 256
  precision: bf16
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  lora_target_modules: q_proj,v_proj
  train_mask_decoder: true
  freeze_region_encoder: true

data:
  manifest_dir: outputs/phase1b_overfit/subset_manifests
  datasets_root: datasets
  synthscars_root: datasets/SynthScars
  split: train

loss:
  text_weight: 1.0
  classification_weight: 1.0
  mask_bce_weight: 2.0
  mask_dice_weight: 0.5
  consistency_weight: 0.0
  seg_token_weight: 0.0
  text_normalization: token_mean
  per_sample_text_loss_normalization: false

optimizer:
  name: AdamW
  lora_lr: 0.0003
  classification_head_lr: 0.0003
  text_hidden_fcs_lr: 0.0003
  mask_decoder_lr: 0.0003
  embedding_lr: 0.00003
  lm_head_lr: 0.00003
  betas: [0.9, 0.95]
  weight_decay: 0.0
  gradient_clip_norm: 1.0

training:
  max_optimizer_steps: 320
  batch_size_per_device: 2
  gradient_accumulation_steps: 1
  scheduler: linear_warmup_decay
  warmup_steps: 20
  num_workers: 0

evaluation:
  max_new_tokens: 400
  prompt_template_id: unified_forensics_v1

features:
  npr: false
  srm: false
  forensic_fusion: none
  consistency_loss: false
  seg_token_loss: false
  artifact_head: false
  known_fake_auxiliary: false
  prompt_diversity_training: false
