experiment:
  name: phase3d1_policy_optimization
  seed: 3407
  output_root: outputs/phase3d1_policy_optimization
  checkpoint_root: /data/yz/groundingLMM_official/checkpoints/phase3d1_policy_optimization
  arms: [P1-FROZEN, P3D1-R3, P3D1-Q2]
  excluded_initial_arms: [P3D1-RSFT, Q2-no-grounding, Q2-lexical]
source:
  model_config: configs/phase3a_p1.yaml
  selector: outputs/phase3a_phrase_grounding/selection/p1_selector.json
  checkpoint: /data/yz/groundingLMM_official/checkpoints/phase3a_phrase_grounding/p1/best/checkpoint/mp_rank_00_model_states.pt
  checkpoint_sha256: fa4856f8c173c300050c3ae2149354e63a52bbced762d83fe518e9666136b326
  optimizer_step: 3500
  epoch: 7
data:
  manifest_dir: outputs/data_audits/unified_forensics_split_v1
  datasets_root: datasets
  synthscars_root: datasets/SynthScars
  split: train
  sampler: balanced_real_fake_deterministic
algorithm:
  name: GROUP_RELATIVE_REINFORCE
  description: GRPO-style fresh on-policy group-relative update without PPO clipping or reference KL
  on_policy: true
  rollout_cache_reused: false
  K: 8
  group_advantage: population_zscore
  advantage_epsilon: 1.0e-8
  sequence_logprob: generated_token_mean
  updates_per_group: 1
  kl_coefficient: 0.0
  entropy_coefficient: 0.0
sampling:
  do_sample: true
  temperature: 0.8
  top_p: 0.95
  max_new_tokens: 400
training:
  total_optimizer_steps: 2000
  checkpoint_interval: 250
  batch_size_prompts_per_device: 1
  rollout_group_size: 8
  gradient_accumulation_steps: 1
  policy_trajectory_micro_batch_size: 1
  trajectory_micro_batches_per_update: 8
  effective_prompts_per_update: 1
  precision: bf16
  gradient_clip_norm: 1.0
optimizer:
  name: AdamW
  learning_rate: 1.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.0
  scheduler: linear_warmup_decay
  warmup_steps: 100
trainable:
  inherit_p1_trainable_modules: true
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.05
  lora_target_modules: q_proj,v_proj
reward:
  R3:
    version: R3_phase3d0
    implementation: tools/phase3d0.py
    definition: outputs/phase3d0_reward_preflight/reward_definition.json
  Q2:
    version: Q2_phase3d0r
    implementation: tools/phase3d0r.py
    definition: outputs/phase3d0r_reward_reformulation/reward_definition.json
    selected_reward: outputs/phase3d0r_reward_reformulation/selected_reward.json
    semantic_encoder_provenance: outputs/phase3d0r_reward_reformulation/semantic_encoder_provenance.json
    token_idf: outputs/phase3d0r_reward_reformulation/token_idf.json
selector:
  split: internal_validation
  fake_only_for_primary_localization: true
  primary: mean_foreground_iou
  tie_breaker: mean_foreground_f1
  tie_tolerance: 1.0e-12
  secondary_gates:
    - classification_accuracy
    - classification_f1
    - structure_validity
    - R_phrase_sem
  prohibited: [training_reward, test, official1000, external_synthscars_test, RAISE, LOKI]
evaluation:
  bootstrap_repeats: 10000
  bootstrap_seed: 3407
  paired_primary_contrast: P3D1-Q2_minus_P3D1-R3
runtime:
  allowed_physical_gpus: [1, 2]
  R3_gpu: 1
  Q2_gpu: 2
  preserve_cuda_cache: true
  pytorch_cuda_alloc_conf: max_split_size_mb:512
